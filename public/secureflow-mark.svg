<!--
  SecureFlow mark: an S made of two identical halves (client and freelancer)
  held together at the centre by a diamond seal (the escrow).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 4 36 56" fill="none">
  <defs>
    <linearGradient id="sfm-t" x1="20" y1="8" x2="44" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="sfm-b" x1="44" y1="32" x2="20" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <!-- two identical halves of the S: the client (cyan) and the freelancer (indigo) -->
  <path d="M41.6 14.9A10.5 10.5 0 1 0 32 32" stroke="url(#sfm-t)" stroke-width="12"/>
  <path d="M22.4 49.1A10.5 10.5 0 1 0 32 32" stroke="url(#sfm-b)" stroke-width="12"/>
  <!-- the seal that holds them together: the escrow -->
  <rect x="27.4" y="27.4" width="9.2" height="9.2" rx="1.6" transform="rotate(45 32 32)" fill="#fff" stroke="#0B1222" stroke-width="1"/>
</svg>
